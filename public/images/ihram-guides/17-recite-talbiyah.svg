<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Recite Talbiyah Frequently</text>
  <!-- Person praying -->
  <circle cx="200" cy="100" r="20" fill="#d4a574"/>
  <path d="M180 122 L180 180 Q180 190 190 190 L210 190 Q220 190 220 180 L220 122" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Sound waves -->
  <path d="M230 90 Q250 80 250 100 Q250 120 230 110" stroke="#059669" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M245 80 Q275 65 275 100 Q275 135 245 120" stroke="#059669" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M260 70 Q295 50 295 100 Q295 150 260 130" stroke="#059669" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Talbiyah text -->
  <rect x="100" y="210" width="200" height="50" rx="12" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="200" y="232" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#065f46">Labbayk Allahumma Labbayk</text>
  <text x="200" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Recite as much as possible</text>
  <!-- Check marks -->
  <text x="80" y="140" font-family="Arial" font-size="12" fill="#059669">✓ Standing</text>
  <text x="80" y="160" font-family="Arial" font-size="12" fill="#059669">✓ Sitting</text>
  <text x="80" y="180" font-family="Arial" font-size="12" fill="#059669">✓ Walking</text>
</svg>