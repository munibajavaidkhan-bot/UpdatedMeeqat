<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Using Perfume or Fragrance</text>
  <!-- Perfume bottle -->
  <rect x="140" y="70" width="60" height="80" rx="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <rect x="155" y="55" width="30" height="20" rx="4" fill="#7c3aed"/>
  <circle cx="170" cy="100" r="8" fill="white" opacity="0.5"/>
  <!-- Big X -->
  <line x1="130" y1="65" x2="270" y2="155" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="65" x2="130" y2="155" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <!-- Prohibited items list -->
  <rect x="60" y="180" width="280" height="90" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#065f46">All Fragrances Prohibited</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Perfume • Scented Soap • Oil</text>
  <text x="200" y="238" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Deodorant • Creams • Lotion</text>
  <text x="200" y="256" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">After entering Ihram state</text>
</svg>