<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <!-- Step 1: Water -->
  <circle cx="60" cy="100" r="25" fill="#dbeafe"/>
  <text x="60" y="105" text-anchor="middle" font-family="Arial" font-size="20">💧</text>
  <text x="60" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Ghusl</text>
  <!-- Arrow -->
  <path d="M90 100 L120 100" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <!-- Step 2: Clothes -->
  <circle cx="150" cy="100" r="25" fill="#dcfce7"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial" font-size="20">👘</text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Ihram</text>
  <!-- Arrow -->
  <path d="M180 100 L210 100" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <!-- Step 3: Prayer -->
  <circle cx="240" cy="100" r="25" fill="#fef3c7"/>
  <text x="240" y="105" text-anchor="middle" font-family="Arial" font-size="20">🕌</text>
  <text x="240" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Prayer</text>
  <!-- Arrow -->
  <path d="M270 100 L300 100" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <!-- Step 4: Niyat -->
  <circle cx="330" cy="100" r="25" fill="#ede9fe"/>
  <text x="330" y="105" text-anchor="middle" font-family="Arial" font-size="20">🤲</text>
  <text x="330" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Niyat</text>
  <!-- Talbiyah -->
  <rect x="80" y="180" width="240" height="50" rx="12" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#065f46">Labbayk Allahumma Labbayk</text>
  <text x="200" y="218" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Recite Talbiyah at Meeqat</text>
  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">How to Enter Ihram</text>
</svg>