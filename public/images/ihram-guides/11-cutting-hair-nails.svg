<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Cutting Hair or Nails</text>
  <!-- Scissors -->
  <rect x="120" y="80" width="160" height="100" rx="12" fill="white" stroke="#059669" stroke-width="2"/>
  <circle cx="160" cy="120" r="20" fill="none" stroke="#6b7280" stroke-width="3"/>
  <circle cx="240" cy="120" r="20" fill="none" stroke="#6b7280" stroke-width="3"/>
  <line x1="175" y1="110" x2="225" y2="130" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="130" x2="225" y2="110" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <!-- Big X -->
  <line x1="130" y1="85" x2="270" y2="175" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="85" x2="130" y2="175" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <!-- Prohibited items -->
  <rect x="60" y="200" width="280" height="60" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Hair</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Nails</text>
  <text x="290" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Beard</text>
  <text x="200" y="248" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#065f46">ALL PROHIBITED during Ihram</text>
</svg>