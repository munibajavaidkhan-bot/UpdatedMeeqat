  <path d="M115 105 L105 85 M115 105 L125 85" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="175" x2="110" y2="200" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="175" x2="140" y2="200" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="170" x2="170" y2="195" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="165" x2="190" y2="190" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
