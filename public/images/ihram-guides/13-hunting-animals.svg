  <!-- Note -->
  <rect x="80" y="240" width="240" height="40" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#065f46">Hunting any land animal is forbidden</text>
