<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Footwear for Men</text>
  <!-- Allowed sandal -->
  <rect x="60" y="80" width="120" height="80" rx="12" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="120" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#059669">✓ Allowed</text>
  <!-- Sandal illustration -->
  <ellipse cx="120" cy="120" rx="40" ry="15" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M90 115 Q120 100 150 115" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M100 125 Q120 115 140 125" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <text x="120" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Open sandal</text>
  <!-- Not allowed shoe -->
  <rect x="220" y="80" width="120" height="80" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  <text x="280" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ef4444">✗ Not Allowed</text>
  <!-- Shoe illustration -->
  <ellipse cx="280" cy="120" rx="40" ry="15" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M250 110 Q280 95 310 110 L310 125 Q280 135 250 125Z" fill="#4b5563" stroke="#374151" stroke-width="1.5"/>
  <text x="280" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Closed shoe</text>
  <!-- Foot note -->
  <rect x="80" y="190" width="240" height="50" rx="8" fill="#dcfce7"/>
  <text x="200" y="212" text-anchor="middle" font-family="Arial" font-size="11" fill="#065f46">Ankles and back of feet</text>
  <text x="200" y="228" text-anchor="middle" font-family="Arial" font-size="11" fill="#065f46">must remain uncovered</text>
</svg>