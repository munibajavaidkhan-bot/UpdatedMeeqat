<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Women &amp; Head Covering</text>
  <!-- Person with hijab -->
  <circle cx="180" cy="95" r="22" fill="#d4a574"/>
  <!-- Hijab covering head -->
  <path d="M158 88 Q180 72 202 88 L202 120 Q180 135 158 120Z" fill="#1e293b"/>
  <!-- Face visible -->
  <rect x="168" y="88" width="24" height="20" rx="10" fill="#d4a574"/>
  <!-- Body -->
  <path d="M155 115 L145 220 Q145 230 155 230 L205 230 Q215 230 215 220 L205 115" fill="#1e293b"/>
  <!-- Check mark -->
  <circle cx="180" cy="65" r="10" fill="#059669"/>
  <path d="M175 65 L178 68 L185 61" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Labels -->
  <line x1="210" y1="90" x2="270" y2="80" stroke="#059669" stroke-width="1.5"/>
  <rect x="270" y="70" width="100" height="22" rx="4" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="85" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#065f46">Hijab Required</text>
  <line x1="210" y1="170" x2="270" y2="160" stroke="#059669" stroke-width="1.5"/>
  <rect x="270" y="150" width="100" height="22" rx="4" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="165" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#065f46">Full Coverage</text>
  <!-- Note -->
  <rect x="80" y="245" width="240" height="35" rx="8" fill="#dcfce7"/>
  <text x="200" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#065f46">Head must always be covered</text>
  <text x="200" y="273" text-anchor="middle" font-family="Arial" font-size="9" fill="#059669">Only face and hands remain uncovered</text>
</svg>