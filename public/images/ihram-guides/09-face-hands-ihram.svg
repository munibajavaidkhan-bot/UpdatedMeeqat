<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Face &amp; Hands in Ihram</text>
  <!-- Face -->
  <circle cx="130" cy="120" r="35" fill="#d4a574"/>
  <circle cx="120" cy="115" r="3" fill="#374151"/>
  <circle cx="140" cy="115" r="3" fill="#374151"/>
  <path d="M122 130 Q130 138 138 130" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Check mark on face -->
  <circle cx="130" cy="85" r="10" fill="#059669"/>
  <path d="M125 85 L128 88 L135 81" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="175" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">✓ Face Visible</text>
  <!-- Hands -->
  <rect x="220" y="80" width="120" height="80" rx="12" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="280" y="75" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">✓ Hands Visible</text>
  <!-- Hand illustration -->
  <path d="M250 130 L250 100 M250 100 L260 95 M260 95 L270 90 M270 90 L275 95 M250 100 L240 95 M240 95 L235 100 M250 110 L245 115 M250 110 L255 115" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  <rect x="230" y="115" width="40" height="25" rx="8" fill="#d4a574"/>
  <!-- No Niqab -->
  <rect x="150" y="200" width="100" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="200" y="222" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ef4444">✗ No Niqab</text>
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">During Ihram</text>
</svg>