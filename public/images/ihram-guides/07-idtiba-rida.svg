<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Idtiba — Wearing Rida</text>
  <!-- Person with Idtiba style -->
  <circle cx="180" cy="90" r="20" fill="#d4a574"/>
  <!-- Rida draped over left shoulder only -->
  <path d="M150 112 L150 200 Q150 210 160 210 L200 210 Q210 210 210 200 L210 112" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Right shoulder exposed -->
  <path d="M210 112 L240 125" stroke="#d4a574" stroke-width="6" stroke-linecap="round"/>
  <!-- Rida draped to left -->
  <path d="M150 112 L120 130 L120 180 L150 175" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Labels -->
  <line x1="240" y1="125" x2="300" y2="100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="300" y="90" width="80" height="22" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1"/>
  <text x="340" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#ef4444">Right exposed</text>
  <line x1="120" y1="150" x2="60" y2="140" stroke="#059669" stroke-width="1.5"/>
  <rect x="20" y="130" width="80" height="22" rx="4" fill="#dcfce7" stroke="#059669" stroke-width="1"/>
  <text x="60" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#065f46">Left covered</text>
  <!-- Note -->
  <rect x="80" y="240" width="240" height="35" rx="8" fill="#dcfce7"/>
  <text x="200" y="255" text-anchor="middle" font-family="Arial" font-size="10" fill="#065f46">Sunnah style during Tawaf only</text>
  <text x="200" y="268" text-anchor="middle" font-family="Arial" font-size="9" fill="#059669">Right shoulder uncovered, left covered</text>
</svg>