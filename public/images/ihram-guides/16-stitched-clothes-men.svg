<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Wearing Stitched Clothes (Men)</text>
  <!-- Shirt -->
  <rect x="60" y="70" width="80" height="70" rx="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M60 70 L40 90 L40 110 L60 100" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M140 70 L160 90 L160 110 L140 100" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Shirt</text>
  <!-- Big X -->
  <line x1="50" y1="65" x2="150" y2="145" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="65" x2="50" y2="145" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <!-- Pants -->
  <path d="M220 70 L220 140 L240 140 L240 90 L260 90 L260 140 L280 140 L280 70 Q280 60 270 60 L230 60 Q220 60 220 70Z" fill="#4b5563" stroke="#374151" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Pants</text>
  <!-- Big X -->
  <line x1="210" y1="55" x2="290" y2="145" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="55" x2="210" y2="145" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <!-- Note -->
  <rect x="60" y="180" width="280" height="80" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#065f46">ALL Stitched Clothes Prohibited</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Shirts • Pants • Underwear • Gloves</text>
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Only unstitched cloth is allowed</text>
</svg>