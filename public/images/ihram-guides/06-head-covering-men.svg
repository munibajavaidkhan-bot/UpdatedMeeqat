<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#f0fdf4"/>
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#bbf7d0" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">Head Covering for Men</text>
  <!-- Person with uncovered head -->
  <circle cx="150" cy="100" r="22" fill="#d4a574"/>
  <path d="M125 125 L125 200 Q125 210 135 210 L165 210 Q175 210 175 200 L175 125 Q175 115 165 115 L135 115 Q125 115 125 125Z" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Check mark -->
  <circle cx="150" cy="80" r="10" fill="#059669"/>
  <path d="M145 80 L148 83 L155 76" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#059669">✓ Head Uncovered</text>
  <!-- Prohibited items -->
  <rect x="230" y="80" width="130" height="150" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  <text x="295" y="100" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ef4444">✗ Prohibited</text>
  <!-- Cap -->
  <ellipse cx="260" cy="130" rx="18" ry="10" fill="#6b7280"/>
  <rect x="242" y="120" width="36" height="12" rx="4" fill="#4b5563"/>
  <text x="260" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#374151">Cap</text>
  <!-- Turban -->
  <ellipse cx="320" cy="130" rx="18" ry="12" fill="#fef3c7"/>
  <path d="M302 125 Q320 115 338 125" stroke="#d97706" stroke-width="2" fill="none"/>
  <text x="320" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#374151">Turban</text>
  <!-- Hat -->
  <ellipse cx="260" cy="190" rx="20" ry="8" fill="#1e40af"/>
  <rect x="240" y="178" width="40" height="14" rx="4" fill="#1e3a8a"/>
  <text x="260" y="215" text-anchor="middle" font-family="Arial" font-size="9" fill="#374151">Hat</text>
  <!-- Hood -->
  <path d="M302 175 Q320 165 338 175 L338 200 Q320 210 302 200Z" fill="#6b7280"/>
  <text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="9" fill="#374151">Hood</text>
</svg>