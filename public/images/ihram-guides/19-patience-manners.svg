  <path d="M122 120 L122 170 Q122 180 132 180 L148 180 Q158 180 158 170 L158 120" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="260" cy="100" r="18" fill="#d4a574"/>
  <path d="M242 120 L242 170 Q242 180 252 180 L268 180 Q278 180 278 170 L278 120" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
