  <text x="200" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">🤝 Respect</text>
  <text x="280" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">💪 Help Others</text>
