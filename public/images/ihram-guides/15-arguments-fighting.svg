  <rect x="60" y="220" width="280" height="50" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#065f46">Quran 2:197</text>
  <text x="200" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">"No disputing during Hajj"</text>
